<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">

  <!-- Outer glow -->
  <circle cx="150" cy="150" r="120"
          fill="rgba(255,215,0,0.15)"
          filter="url(#glow)" />

  <!-- Medal base -->
  <circle cx="150" cy="150" r="110"
          fill="url(#goldGradient)"
          stroke="url(#rimGradient)"
          stroke-width="8" />

  <!-- Inner bevel -->
  <circle cx="150" cy="150" r="85"
          fill="url(#innerGradient)"
          stroke="rgba(255,255,255,0.35)"
          stroke-width="3" />

  <!-- Embossed star -->
  <polygon points="150,80 170,135 230,140 185,175 200,230 150,200 100,230 115,175 70,140 130,135"
           fill="url(#starGradient)"
           stroke="rgba(255,255,255,0.4)"
           stroke-width="2" />

  <!-- Glow filter -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gold gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFB700"/>
      <stop offset="100%" stop-color="#E6A400"/>
    </linearGradient>

    <linearGradient id="rimGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4C2"/>
      <stop offset="100%" stop-color="#C28E00"/>
    </linearGradient>

    <radialGradient id="innerGradient">
      <stop offset="0%" stop-color="#FFF8D0"/>
      <stop offset="60%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#C28E00"/>
    </radialGradient>

    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D0"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E6A400"/>
    </linearGradient>
  </defs>

</svg>

