<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Language Learning Trainer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<div class="glass-header">
    <h1>Language Learning Trainer</h1>
    <img src="images/dashboard-hero.png" class="dashboard-hero-img">
</div>

<!-- NAVIGATION (UPDATED FOR NEW JS) -->
<nav class="glass-panel nav-bar">
    <button class="ui-tab is-active" data-tab="dashboard">
        <img src="images/dashboard-hero.png" class="tab-icon"> Dashboard
    </button>

    <button class="ui-tab" data-tab="sentenceSection">
        <img src="images/icon-sentence.png" class="tab-icon"> Sentences
    </button>

    <button class="ui-tab" data-tab="conversationSection">
        <img src="images/badge-conversation.png" class="tab-icon"> Conversation
    </button>

    <button class="ui-tab" data-tab="miningSection">
        <img src="images/mining.png" class="tab-icon"> Mining
    </button>

    <button class="ui-tab" data-tab="dictionarySection">
        <img src="images/grammer.png" class="tab-icon"> Dictionary
    </button>

    <button class="ui-tab" data-tab="reviewSection">
        <img src="images/icon-review.png" class="tab-icon"> Review
    </button>

    <button class="ui-tab" data-tab="certificateGeneratorPage">
        <img src="images/icon-certificate.png" class="tab-icon"> Certificates
    </button>

    <button class="ui-tab" data-tab="repeatPracticeSection">
        <img src="images/repeat.png" class="tab-icon"> Repeat Practice
    </button>
</nav>

<!-- DASHBOARD -->
<div id="dashboard" class="appSection">

    <div class="dashboard-row">
        <div class="dash-left glass-panel">
            <label class="section-title">Audio Speed</label>
            <input type="range" id="speechRateSlider" min="0.6" max="1.4" step="0.1" value="1">
            <div id="speechRateLabel">Rate: 1.0</div>
        </div>

        <div class="dash-right glass-panel">
            <label class="section-title">Skill Level</label>
            <select id="levelSelect" class="input-field"></select>
        </div>
    </div>

    <div class="student-name-box glass-panel">
        <label class="section-title">Your name for certificates</label>
        <input id="certGenNameInput" class="input-field" type="text" placeholder="Enter your name">
        <button id="certGenGenerateButton" class="pill">Save Name</button>
        <div id="name-status"></div>
    </div>

    <!-- Dictionary Search -->
    <div class="student-name-box glass-panel dictionary-search-box">
        <label class="section-title">🔍 Quick Dictionary Search</label>
        <input id="dictionarySearchInput" class="input-field" type="text" placeholder="Search English word...">
        <div id="dictionarySearchOutput"></div>
    </div>

    <!-- Free Practice Sandbox -->
    <div class="student-name-box glass-panel free-practice-box">
        <label class="section-title">🎯 Free Practice Sandbox</label>
        <input id="sandboxInput" class="input-field" type="text" placeholder="Type text...">
        <div id="sandboxOutput"></div>
        <button id="sandboxSpeakButton" class="pill">Speak</button>
    </div>

    <!-- Progress Tiles -->
    <div class="progress-section">
        <div class="progress-tile glass-panel">
            <label class="section-title">Score</label>
            <div id="scoreDisplay">Score: 0</div>
        </div>

        <div class="progress-tile glass-panel">
            <label class="section-title">Progress</label>
            <div id="progressDisplay">Progress: 0%</div>
        </div>

        <div class="progress-tile glass-panel">
            <label class="section-title">Level Progress</label>
            <div id="levelProgressDisplay"></div>
        </div>

        <div class="progress-tile glass-panel">
            <label class="section-title">Level Notifications</label>
            <div id="levelUpNotifications"></div>
        </div>
    </div>

    <!-- Badges -->
    <div class="badge-section glass-panel">
        <h3>Your Badges</h3>
        <ul id="badge-list"></ul>
    </div>
</div>

<!-- SENTENCE MODE -->
<div id="sentenceSection" class="appSection">
    <div class="glass-panel">
        <h2>Sentence Trainer</h2>
        <div id="promptText"></div>
        <div id="optionsContainer"></div>
        <div id="feedbackText"></div>
        <button id="nextButton" class="pill">Next</button>
        <button id="mineSentenceButton" class="pill">Mine Sentence</button>
    </div>
</div>

<!-- CONVERSATION MODE -->
<div id="conversationSection" class="appSection">
    <div class="glass-panel">
        <h2>Conversation Trainer</h2>
        <div id="conversationPrompt"></div>
        <div id="conversationReplies"></div>
        <div id="conversationFeedback"></div>
        <button id="mineConversationButton" class="pill">Mine Reply</button>
    </div>
</div>

<!-- MINING -->
<div id="miningSection" class="appSection">
    <div class="glass-panel">
        <h2>Mined Items</h2>
        <div id="miningList"></div>
    </div>
</div>

<!-- DICTIONARY -->
<div id="dictionarySection" class="appSection">
    <div class="glass-panel">
        <h2>Saved Dictionary Entries</h2>
        <div id="dictionaryList"></div>
    </div>
</div>

<!-- REVIEW -->
<div id="reviewSection" class="appSection">
    <div class="glass-panel">
        <h2>Review Mistakes</h2>
        <div id="reviewPrompt"></div>
        <input id="reviewInput" class="input-field" type="text">
        <div id="reviewFeedback"></div>
        <button id="reviewRetryButton" class="pill">Check</button>
        <div id="review-words-list"></div>
    </div>
</div>

<!-- CERTIFICATES -->
<div id="certificateGeneratorPage" class="appSection">
    <div class="glass-panel">
        <h2>Certificate Generator</h2>
        <select id="certGenLevelSelect" class="input-field">
            <option value="A1">A1</option>
            <option value="A2">A2</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
        </select>
        <button id="certGenDownloadButton" class="pill">Download</button>
        <div id="certGenPreview"></div>
        <h3>Certificate History</h3>
        <div id="certGalleryList"></div>
    </div>
</div>

<!-- REPEAT PRACTICE -->
<div id="repeatPracticeSection" class="appSection">
    <div class="glass-panel">
        <h2>Repeat Practice</h2>
        <div id="repeatPrompt"></div>
        <div id="repeatOptions"></div>
        <div id="repeatFeedback"></div>
    </div>
</div>

<script src="LanguageLoader.js"></script>
<script src="app.js"></script>

</body>
</html>
